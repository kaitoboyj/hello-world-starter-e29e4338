[build]
  command = "npm run build"
  # Nitro's "netlify" preset emits static assets to dist/ and the SSR handler to
  # .netlify/functions-internal/ (auto-detected by Netlify). Nitro also writes its
  # own _headers / _redirects into dist/, so no manual SPA fallback is needed here.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"
  # Force the Netlify output format regardless of local environment.
  NITRO_PRESET = "netlify"
