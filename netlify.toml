[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  CI = "false"
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps --ignore-scripts"
  NETLIFY_USE_BUN = "false"
  NETLIFY_USE_PNPM = "false"
  NETLIFY_USE_YARN = "false"
  NODE_OPTIONS = "--max-old-space-size=6144"
  PUPPETEER_SKIP_DOWNLOAD = "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
  VITE_SUPABASE_URL = "https://zqgqkcxxsvyqyxsjyxlj.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_CmzVUF0Cky7pSdZu46ixwA_OyVnUR6k"
  VITE_SUPABASE_PROJECT_ID = "zqgqkcxxsvyqyxsjyxlj"

# SPA fallback — all routes served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache hashed JS/CSS chunks forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Serve .exe files as binary downloads (not blocked by browser)
[[headers]]
  for = "/downloads/*.exe"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=86400"

# Don't cache index.html so deploys take effect immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
