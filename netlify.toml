[build]
  command = "npm run build"
  # Nitro's "netlify" preset emits static assets to .output/public and the SSR
  # handler to .netlify/functions-internal/ (auto-detected by Netlify). Nitro
  # writes its own _headers / _redirects, so no manual SPA fallback is needed.
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22.12.0"
